name: Cross-Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-cli:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS even when one fails, so a single platform problem
      # does not hide the results of the others.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (net10.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The RID follows the runner's real architecture so the published
      # binary can be executed and verified on the runner itself. Current
      # runners: Windows/Linux x64, macOS ARM64 (Apple Silicon).
      - name: Compute RID
        id: rid
        shell: bash
        run: |
          ARCH=$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')
          OS=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          case "$OS" in
            windows) RID="win-$ARCH" ;;
            macos)   RID="osx-$ARCH" ;;
            linux)   RID="linux-$ARCH" ;;
            *) echo "Unsupported OS: $RUNNER_OS"; exit 1 ;;
          esac
          echo "rid=$RID" >> "$GITHUB_OUTPUT"
          echo "RID: $RID (runner: $RUNNER_OS/$RUNNER_ARCH)"

      - name: Restore
        run: dotnet restore GuardianProgramStation.sln

      - name: Build (Release, whole solution)
        run: dotnet build GuardianProgramStation.sln --no-restore --configuration Release

      - name: Run all tests
        run: dotnet test GuardianProgramStation.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Locate CLI binary
        id: cli
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "cli=./Cli/bin/Release/net10.0/guardian-program-station.exe" >> "$GITHUB_OUTPUT"
          else
            echo "cli=./Cli/bin/Release/net10.0/guardian-program-station" >> "$GITHUB_OUTPUT"
          fi

      - name: Functional CLI verification (help/version/create/preview/validate/template + exit codes + UTF-8 + filesystem)
        shell: bash
        run: bash ci/verify-cli.sh "${{ steps.cli.outputs.cli }}"

      - name: Upload CLI verification log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-verify-log-${{ matrix.os }}
          path: cli-verify.log
          if-no-files-found: warn

      # Framework-dependent publish (requires the .NET runtime, but not an SDK)
      # built from the same commit that just passed Build + Tests + CLI
      # verification. Packaging strategy (self-contained vs framework-dependent)
      # is intentionally left for a later release decision.
      - name: Publish CLI (${{ steps.rid.outputs.rid }})
        shell: bash
        run: |
          dotnet publish Cli/Cli.csproj \
            --configuration Release \
            --runtime ${{ steps.rid.outputs.rid }} \
            --self-contained false \
            --output "publish/${{ steps.rid.outputs.rid }}"

      - name: Verify published CLI (${{ steps.rid.outputs.rid }})
        shell: bash
        run: |
          BIN="publish/${{ steps.rid.outputs.rid }}/guardian-program-station"
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="$BIN.exe"
          fi
          if [ ! -f "$BIN" ]; then
            echo "FAIL: published binary not found: $BIN"
            exit 1
          fi
          echo "Binary exists: $BIN"
          echo "--- --version ---"
          "$BIN" --version
          echo "--- --help ---"
          "$BIN" --help | head -8

      - name: Upload CLI artifact (${{ steps.rid.outputs.rid }})
        uses: actions/upload-artifact@v4
        with:
          name: guardian-program-station-${{ steps.rid.outputs.rid }}
          path: publish/${{ steps.rid.outputs.rid }}/**
          if-no-files-found: error
